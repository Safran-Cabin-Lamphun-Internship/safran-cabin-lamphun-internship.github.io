    <div class="w-full max-w-[1280px] mx-auto flex flex-col gap-3 px-5 py-10 lg:px-8 md:flex-row md:items-center md:justify-between">
     <p data-template-id="footer-brand" class="canva-text text-sm font-bold tracking-[.13em]"></p>
     <p class="text-sm text-slate-300" data-copy="footerText"></p>

  </div>
  <script>
    let opportunities = [];
    let copy = {en:{}, th:{}};
    let currentLanguage = "en";
    let managedSite = {};
    const $ = (id) => document.getElementById(id);

    function escapeHtml(value){return String(value ?? "").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
    function getField(item, field){
      const langKey = field + "_" + currentLanguage;
      return item[langKey] ?? item[field] ?? "";
    }

    function renderOpportunities() {
      const query = $("searchInput").value.trim().toLowerCase();
      const department = $("departmentFilter").value;
      const list = $("opportunityList");
      list.innerHTML = "";
      const items = opportunities.filter(item => {
        const search = `${item.dept} ${item.role} ${getField(item,"major")} ${getField(item,"period")}`.toLowerCase();
        return (!query || search.includes(query)) && (!department || item.dept === department);
      });
      $("emptyState").classList.toggle("hidden", items.length !== 0);
      items.forEach(item => {
        const row = document.createElement("article");
        row.className = "opportunity-row";
        row.innerHTML = `
          <div><p class="text-[.69rem] font-bold tracking-[.1em] text-[#006fb9] uppercase">${escapeHtml(item.dept)}</p></div>
          <div><h3 class="font-bold text-[#0d2742]">${escapeHtml(item.role)}</h3></div>
          <div class="major-cell"><p class="leading-relaxed text-[#5a6d7d]">${escapeHtml(getField(item,"major"))}</p></div>
          <div class="period-cell"><p class="text-sm font-semibold text-[#455d71]">${escapeHtml(getField(item,"period"))}</p></div>
        `;
        list.appendChild(row);
      });
    }

    function populateDepartments() {
      const selected = $("departmentFilter").value;
      const departments = [...new Set(opportunities.map(item => item.dept).filter(Boolean))];
      $("departmentFilter").innerHTML = `<option value="">${escapeHtml(copy[currentLanguage].allDepartments || "")}</option>` +
        departments.map(dept => `<option value="${escapeHtml(dept)}">${escapeHtml(dept)}</option>`).join("");
      $("departmentFilter").value = departments.includes(selected) ? selected : "";
    }

    function applyLanguage(language) {
      currentLanguage = language;
      document.documentElement.lang = language === "th" ? "th" : "en";
      document.querySelectorAll("[data-copy]").forEach(el => {
        const value = copy[language]?.[el.dataset.copy] ?? "";
        if (el.dataset.copy === "heroTitle") el.innerHTML = value;
        else if (el.tagName === "INPUT") el.placeholder = value;
        else el.textContent = value;
      });
      $("searchInput").placeholder = copy[language]?.search || "";
      populateDepartments();
      renderOpportunities();
      const managedAddress = document.querySelector('[data-template-id="address-detail"]');
      if (managedAddress) managedAddress.textContent = language === "th" ? (managedSite.address_th || "") : (managedSite.address_en || "");
      ["enButton","thButton"].forEach(id => {
        const active = id.startsWith(language);
        $(id).classList.toggle("active", active);
        $(id).setAttribute("aria-pressed", String(active));
      });
      $("mobileEnButton").className = language === "en" ? "border border-[#071b34] bg-[#071b34] px-4 py-2 text-xs font-bold text-white" : "border border-[#cad8e1] px-4 py-2 text-xs font-bold text-[#071b34]";
      $("mobileThButton").className = language === "th" ? "border border-[#071b34] bg-[#071b34] px-4 py-2 text-xs font-bold text-white" : "border border-[#cad8e1] px-4 py-2 text-xs font-bold text-[#071b34]";
    }

    function closeMenu() {
      $("mobileDrawer").classList.remove("open");
      $("mobileOverlay").classList.remove("open");
      $("menuButton").setAttribute("aria-expanded","false");
    }

    async function loadManagedContent() {
      try {
        let managed = window.__PREVIEW_CONTENT;
        if (!managed) {
          const response = await fetch("./data/site-content.json", {cache:"no-store"});
          if (!response.ok) throw new Error("Cannot load site content");
          managed = await response.json();
        }
        copy = managed.copy || {en:{},th:{}};
        managedSite = managed.site || {};
        opportunities = (managed.internships || []).map(r => ({
          dept: r.department || "",
          role: r.position || "",
          study: r.major || "",
          period: r.period || "",
          major_en: r.major_en ?? r.major ?? "",
          major_th: r.major_th ?? r.major ?? "",
          period_en: r.period_en ?? r.period ?? "",
          period_th: r.period_th ?? r.period ?? "",
          education_en: r.education_en ?? r.education ?? "",
          education_th: r.education_th ?? r.education ?? "",
          skills_en: r.skills_en ?? r.skills ?? "",
          skills_th: r.skills_th ?? r.skills ?? "",
          responsibilities_en: r.responsibilities_en ?? r.responsibilities ?? "",
          responsibilities_th: r.responsibilities_th ?? r.responsibilities ?? "",
          quantity: r.quantity ?? "",
          status: r.status || "Open",
          internship_id: r.internship_id || ""
        }));
        document.querySelectorAll('[data-template-id="brand-name"]').forEach(el => el.textContent = managedSite.brand || "");
        document.querySelectorAll('[data-template-id="footer-brand"]').forEach(el => el.textContent = managedSite.footer_brand || "");
        applyLanguage(currentLanguage);
      } catch (e) {
        console.warn("Managed content could not be loaded.", e);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      ["enButton","thButton","mobileEnButton","mobileThButton"].forEach(id => $(id).addEventListener("click", () => applyLanguage(id.toLowerCase().includes("th") ? "th" : "en")));
      $("searchInput").addEventListener("input", renderOpportunities);
      $("departmentFilter").addEventListener("change", renderOpportunities);
      loadManagedContent();
    });
  </script>
 </body>
</html>
